<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Velocidade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="speedtest">
        <section class="hero">
            <p class="eyebrow">VELOCIDADE DA REDE</p>
            <h1>Qual é a velocidade da sua internet?</h1>
            <p class="subtitle">
                Versão inicial do site PING.COM.
            </p>

            <div class="speed-display">
                <span class="speed-value">00.00</span>
                <span class="speed-unit">Mbps</span>
            </div>

            <button class="start-button">INICIAR TESTE</button>
        </section>

        <section class="stats">
            <div class="stat-card">
                <span class="stat-label">PING</span>
                <strong>-- ms</strong>
            </div>

            <div class="stat-card">
                <span class="stat-label">DOWNLOAD</span>
                <strong>-- Mbps</strong>
            </div>

            <div class="stat-card">
                <span class="stat-label">UPLOAD</span>
                <strong>-- Mbps</strong>
            </div>
        </section>
    </main>
</body>
</html>
